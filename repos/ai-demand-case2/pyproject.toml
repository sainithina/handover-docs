[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "case2-demand-estimation"
version = "0.1.0"
description = "Case 2: AI Demand Estimation with SV + ASV Bayesian Fusion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Case 2 Team" }]
dependencies = [
  "pydantic>=2.7.0,<3",
  "pydantic-settings>=2.2.1,<3",
  "httpx>=0.27.0,<1",
  "tenacity>=8.2.3,<9",
  "rich>=13.7.1,<14",
  "python-dotenv>=1.0.1,<2",
  "numpy>=1.20.0",
  "sentence-transformers>=2.2.0,<3",
  "openai>=1.40.0,<2",
  "json-repair>=0.7.0",
  "gradio>=5.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0,<9", "ruff>=0.5.0,<1"]

[project.scripts]
case2 = "case2_demand.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
